[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "exceptions_full"
description = "Exception handlers that are fully-featured, i.e., aware of the apic/task subsystems, and kill tasks on an exception"
version = "0.1.0"
edition = "2018"

[dependencies]
x86_64 = "0.14.8"
log = "0.4.8"
locked_idt = { path = "../../../libs/locked_idt" }
uentry = { path = "../../arch/x86_64/uentry" }

[dependencies.early_printer]
path = "../early_printer"

[dependencies.app_io]
path = "../../console/app_io"

[dependencies.cpu]
path = "../../arch/common/cpu"

[dependencies.tlb_shootdown]
path = "../../mm/tlb_shootdown"

[dependencies.task]
path = "../../sched/task"

[dependencies.memory_swap]
path = "../../mm/memory_swap"

[dependencies.memory_x86_64]
path = "../../arch/x86_64/memory_x86_64"

[dependencies.task_struct]
path = "../../sched/task_struct"

[dependencies.fault_log]
path = "../../system/fault_log"

[dependencies.pmu_x86]
path = "../../arch/x86_64/pmu_x86"

[dependencies.unwind]
path = "../../loader/unwind"

[dependencies.memory]
path = "../../mm/memory"

[dependencies.stack_trace]
path = "../../loader/stack_trace"

[dependencies.tss]
path = "../../arch/x86_64/tss"

[dependencies.debug_info]
path = "../../loader/debug_info"

[dependencies.signal_handler]
path = "../../sched/signal_handler"

[lib]
crate-type = ["rlib"]
