[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "multicore_bringup"
description = "Support for bringing up other CPU cores (APs) from the main core (BSP)"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9.4"
volatile = "0.2.7"
zerocopy = "0.5.0"
log = "0.4.8"
irq_safety = { git = "https://github.com/theseus-os/irq_safety" }
memory = { path = "../../mm/memory" }
stack = { path = "../../mm/stack" }
cpu = { path = "../../arch/common/cpu" }
mod_mgmt = { path = "../../loader/mod_mgmt" }
ap_start = { path = "../ap_start" }
kernel_config = { path = "../kernel_config" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
psci = "0.1.1"
memory_aarch64 = { path = "../../arch/aarch64/memory_aarch64" }
arm_boards = { path = "../../arch/aarch64/arm_boards" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
pit_clock_basic = { path = "../../arch/x86_64/pit_clock_basic" }
acpi = { path = "../../drivers/bus/acpi" }
apic = { path = "../../arch/x86_64/apic" }
tsc = { path = "../../arch/x86_64/tsc" }
madt = { path = "../../drivers/bus/acpi/madt" }

[lib]
crate-type = ["rlib"]
