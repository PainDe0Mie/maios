[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "task_struct"
description = "Basic task struct definition for multithreading"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-utils = { version = "0.8.12", default-features = false }
log = "0.4.8"
spin = "0.9.4"

cpu = { path = "../../arch/common/cpu" }
environment = { path = "../environment" }
kernel_config = { path = "../../boot/kernel_config" }
memory = { path = "../../mm/memory" }
mod_mgmt = { path = "../../loader/mod_mgmt" }
stack = { path = "../../mm/stack" }
sync_irq = { path = "../../../libs/sync_irq" }
maisched = { path = "../maisched" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
uentry = { path = "../../arch/x86_64/uentry" }
