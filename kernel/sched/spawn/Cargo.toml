[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "spawn"
description = "Functions and wrappers for spawning new Tasks, both kernel threads and userspace processes."
version = "0.1.0"
edition = "2018"


[dependencies]
cfg-if = "1.0.0"
log = "0.4.8"
spin = "0.9.4"
lazy_static = { features = ["spin_no_std"], version = "1.4.0" }

debugit = { path = "../../../libs/debugit" }

memory = { path = "../../mm/memory" }
heap = { path = "../../mm/heap" }
stack = { path = "../../mm/stack" }
cpu = { path = "../../arch/common/cpu" }
preemption = { path = "../preemption" }
irq_safety = { git = "https://github.com/theseus-os/irq_safety" }
task = { path = "../task" }
task_struct = { path = "../task_struct" }
scheduler = { path = "../scheduler" }
mod_mgmt = { path = "../../loader/mod_mgmt" }
context_switch = { path = "../../arch/common/context_switch" }
path = { path = "../../fs/path" }
fs_node = { path = "../../fs/fs_node" }
thread_local_macro = { path = "../../loader/thread_local_macro" }
no_drop = { path = "../../mm/no_drop" }
early_tls = { path = "../../boot/early_tls" }
environment = { path = "../environment" }


[target.'cfg(target_arch = "x86_64")'.dependencies]
fault_crate_swap = { path = "../../system/fault_crate_swap" }
catch_unwind = { path = "../../boot/catch_unwind" }
fault_log = { path = "../../system/fault_log" }

[lib]
crate-type = ["rlib"]
