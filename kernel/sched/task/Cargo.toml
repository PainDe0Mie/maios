[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "task"
description = "Shareable Task reference with more robust multithreading functionality"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.8"
spin = "0.9.4"
static_assertions = "1.1.0"
crossbeam-utils = { version = "0.8.2", default-features = false }

irq_safety = { git = "https://github.com/theseus-os/irq_safety" }

context_switch = { path = "../../arch/common/context_switch" }
cls = { path = "../cls" }
cpu = { path = "../../arch/common/cpu" }
environment = { path = "../environment" }
memory = { path = "../../mm/memory" }
mod_mgmt = { path = "../../loader/mod_mgmt" }
no_drop = { path = "../../mm/no_drop" }
preemption = { path = "../preemption" }
stack = { path = "../../mm/stack" }
sync_irq = { path = "../../../libs/sync_irq" }
maisched = { path = "../maisched" }
sync_preemption = { path = "../../sync/sync_preemption" }
task_struct = { path = "../task_struct" }
waker_generic = { path = "../../sync/waker_generic" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
uentry = { path = "../../arch/x86_64/uentry" }
