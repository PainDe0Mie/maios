[package]
name = "window_manager"
version = "0.1.0"
authors = ["PainDe0Mie"]
description = "MaiCompositor : gestionnaire de fenêtres et compositeur piloté par les événements"
edition = "2021"

[dependencies]
spin = "0.9.4"
mpmc = "0.1.6"

[dependencies.log]
version = "0.4.8"

[dependencies.sleep]
path = "../../sched/sleep"

[dependencies.task]
path = "../../sched/task"

[dependencies.time]
path = "../../sched/time"

[dependencies.wait_queue]
path = "../../sync/wait_queue"

[dependencies.sync_irq]
path = "../../../libs/sync_irq"

[dependencies.region2d]
path = "../region2d"

[dependencies.window_inner]
path = "../window_inner"

[dependencies.mgi]
path = "../mgi"

[dependencies.shapes]
path = "../shapes"

[dependencies.framebuffer]
path = "../framebuffer"

[dependencies.event_types]
path = "../event_types"

[dependencies.mod_mgmt]
path = "../../loader/mod_mgmt"

[dependencies.spawn]
path = "../../sched/spawn"

[dependencies.mouse_data]
path = "../../../libs/mouse_data"

[dependencies.keycodes_ascii]
path = "../../../libs/keycodes_ascii"

[dependencies.keyboard]
path = "../../drivers/input/keyboard"

[lib]
crate-type = ["rlib"]
