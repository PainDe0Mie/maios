[package]
name = "uvm"
description = "MaiProc : memoire virtuelle des processus utilisateur (VMA, fautes a la demande, mmap, copies noyau/utilisateur, ASLR)"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.8"
spin = "0.9.4"
memory = { path = "../memory" }
frame_allocator = { path = "../frame_allocator" }
kernel_config = { path = "../../boot/kernel_config" }
sync_irq = { path = "../../../libs/sync_irq" }

[lib]
crate-type = ["rlib"]
