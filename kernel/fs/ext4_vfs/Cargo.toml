[package]
name = "ext4_vfs"
version = "0.1.0"
edition = "2021"
description = "MaiSS : volumes ext4 dans le VFS (accès disque par blk, cache des métadonnées, cache d'identité des inodes et des noms, montage et racine Linux)."

[dependencies]
log = "0.4.8"
spin = "0.9.4"
ext4 = { path = "../ext4" }
blk = { path = "../../drivers/storage/blk" }
fs_node = { path = "../fs_node" }
io = { path = "../../console/io" }
memory = { path = "../../mm/memory" }
root = { path = "../root" }
vfs_node = { path = "../vfs_node" }
partition_table = { path = "../partition_table" }

[lib]
crate-type = ["rlib"]
