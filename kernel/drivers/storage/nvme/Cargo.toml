[package]
name    = "nvme"
version = "0.1.0"
edition = "2021"

[lib]
name       = "nvme"
crate-type = ["rlib"]

[dependencies]
log            = { version = "0.4", default-features = false }
spin           = { version = "0.9", default-features = false, features = ["mutex", "once"] }
memory         = { path = "../../../mm/memory" }
pci            = { path = "../../bus/pci" }
storage_device = { path = "../storage_device" }
io             = { path = "../../../console/io" }
interrupts     = { path = "../../../arch/common/interrupts" }