[package]
name = "blk"
version = "0.1.0"
edition = "2021"
description = "MaiSS : couche bloc à files multiples (blk-mq), attente hybride, chien de garde."

[dependencies]
log = "0.4.8"
spin = "0.9.4"
irq_safety = { git = "https://github.com/theseus-os/irq_safety" }
sync_irq = { path = "../../../../libs/sync_irq" }
memory = { path = "../../../mm/memory" }
frame_allocator = { path = "../../../mm/frame_allocator" }
kernel_config = { path = "../../../boot/kernel_config" }
cpu = { path = "../../../arch/common/cpu" }
task = { path = "../../../sched/task" }
preemption = { path = "../../../sched/preemption" }
spawn = { path = "../../../sched/spawn" }
sleep = { path = "../../../sched/sleep" }
time = { path = "../../../sched/time" }
io = { path = "../../../console/io" }
storage_device = { path = "../storage_device" }

[lib]
crate-type = ["rlib"]
