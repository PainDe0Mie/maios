[package]
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
name = "pci"
description = "Basic PCI support for Theseus."
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9.4"
bit_field = "0.7.0"
log = "0.4.8"
volatile = "0.2.4"
zerocopy = "0.5.0"

memory = { path = "../../../mm/memory" }
cpu = { path = "../../../arch/common/cpu" }
interrupts = { path = "../../../arch/common/interrupts" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
port_io = { path = "../../../../libs/port_io" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arm_boards = { path = "../../../arch/aarch64/arm_boards" }
interrupt_controller = { path = "../../../arch/common/interrupt_controller" }

[lib]
crate-type = ["rlib"]
