[package]
name = "test_block_io"
version = "0.1.0"
authors = ["Kevin Boos <kevinaboos@gmail.com>"]
description = "a simple app for testing IO transfers for block devices"
edition = "2021"

[dependencies]
core2 = { version = "0.4.0", default-features = false, features = ["alloc", "nightly"] }

[dependencies.log]
version = "0.4.8"

[dependencies.app_io]
path = "../../../kernel/console/app_io"

[dependencies.task]
path = "../../../kernel/sched/task"

[dependencies.io]
path = "../../../kernel/console/io"

[dependencies.storage_manager]
path = "../../../kernel/fs/storage_manager"

[dependencies.ata]
path = "../../../kernel/drivers/storage/ata"
