[package]
name = "shell"
version = "0.1.0"
description = "Shell that can run commands in application directory"
authors = ["PainDe0Mie"]


[dependencies]
spin = "0.9.4"
core2 = { version = "0.4.0", default-features = false, features = ["alloc", "nightly"] }

[dependencies.cpu]
path = "../../../kernel/arch/common/cpu"

[dependencies.log]
version = "0.4.8"

[dependencies.keycodes_ascii]
path = "../../../libs/keycodes_ascii"

[dependencies.dfqueue]
path = "../../../libs/dfqueue"
version = "0.1.0"

[dependencies.event_types]
path = "../../../kernel/gfx/event_types"

[dependencies.spawn]
path = "../../../kernel/sched/spawn"

[dependencies.task]
path = "../../../kernel/sched/task"

[dependencies.window_manager]
path = "../../../kernel/gfx/window_manager"

[dependencies.environment]
path = "../../../kernel/sched/environment"

[dependencies.root]
path = "../../../kernel/fs/root"

[dependencies.path]
path = "../../../kernel/fs/path"

[dependencies.libterm]
path = "../../../kernel/console/libterm"

[dependencies.scheduler]
path = "../../../kernel/sched/scheduler"

[dependencies.sleep]
path = "../../../kernel/sched/sleep"

[dependencies.stdio]
path = "../../../libs/stdio"

[dependencies.lazy_static]
features = ["spin_no_std"]
version = "1.4.0"

[dependencies.app_io]
path = "../../../kernel/console/app_io"

[dependencies.fs_node]
path = "../../../kernel/fs/fs_node"

[dependencies.mod_mgmt]
path = "../../../kernel/loader/mod_mgmt"

[lib]
crate-type = ["rlib"]
