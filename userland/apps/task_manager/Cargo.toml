[package]
name = "task_manager"
version = "0.2.0"
description = "Gestionnaire des tâches de MaiOS : processus, performance, ordonnanceur"
edition = "2021"

[lib]
name = "task_manager"
crate-type = ["rlib"]

[dependencies]
log             = "0.4.8"
color           = { path = "../../../kernel/gfx/color" }
shapes          = { path = "../../../kernel/gfx/shapes" }
mai_ui          = { path = "../../../kernel/gfx/mai_ui" }
window          = { path = "../../../kernel/gfx/window" }
event_types     = { path = "../../../kernel/gfx/event_types" }
keycodes_ascii  = { path = "../../../libs/keycodes_ascii" }
task            = { path = "../../../kernel/sched/task" }
task_struct     = { path = "../../../kernel/sched/task_struct" }
maisched        = { path = "../../../kernel/sched/maisched" }
sleep           = { path = "../../../kernel/sched/sleep" }
cpu             = { path = "../../../kernel/arch/common/cpu" }
frame_allocator = { path = "../../../kernel/mm/frame_allocator" }
heap            = { path = "../../../kernel/mm/heap" }
mgi             = { path = "../../../kernel/gfx/mgi" }
window_manager  = { path = "../../../kernel/gfx/window_manager" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
maiproc         = { path = "../../../kernel/system/maiproc" }
uvm             = { path = "../../../kernel/mm/uvm" }
