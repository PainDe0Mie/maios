# Configuration de Limine pour MaiOS (protocole Limine natif, BIOS et UEFI).
# Les empreintes @KERNEL_HASH@ et @MODULES_HASH@ (BLAKE2b) sont posées par `make` : Limine refuse
# de démarrer un noyau ou des modules altérés.

# Démarrage immédiat, sans menu ni texte.
timeout: 0
quiet: yes
default_entry: 1
hash_mismatch_panic: yes

# Si le menu est affiché (touche maintenue au démarrage).
interface_branding: MaiOS
interface_branding_colour: 5
interface_help_hidden: yes
term_background: 001a1030
term_foreground: e8e0ff
backdrop: 1a1030

# Mode graphique du bureau MaiOS (GOP en UEFI, VBE en BIOS) ; Limine prend le plus proche si
# l'écran ne le propose pas.
/MaiOS
    protocol: limine
    path: boot():/boot/kernel.bin#@KERNEL_HASH@
    module_path: boot():/boot/modules.cpio.lz4#@MODULES_HASH@
    module_string: modules.cpio.lz4
    resolution: 1920x1080
    paging_mode: 4level
